<title>Curly Screening Room</title>
<style>
/* Layout: a single dark screening room; the video owns the screen, and in landscape it fills the whole phone. */
:root {
  --bg: #0e0f12;
  --screen: #000;
  --fg: #f3f1ea;
  --muted: #9a9ba3;
  --green: #0a8f4a;
  --red: #d2323f;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Nunito Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 32px; display: grid; gap: 16px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7vw, 48px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 .flag { display: inline-block; width: 1.1em; height: .7em; margin-right: .3em; vertical-align: .05em;
  background: linear-gradient(90deg, var(--green) 0 33.3%, var(--fg) 33.3% 66.6%, var(--red) 66.6%); border-radius: 3px; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.stage { position: relative; background: var(--screen); border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--screen); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: 700 16px var(--body); color: var(--fg); background: var(--green); border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.rotate { display: inline-block; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 40% { transform: rotate(0) } 60%, 100% { transform: rotate(90deg) } }
@media (prefers-reduced-motion: reduce) { .rotate { animation: none; } }

/* Phone turned sideways: drop everything but the video and fill the screen. */
@media (orientation: landscape) and (max-height: 540px) {
  :root { padding: 0 !important; }
  .wrap { max-width: none; padding: 0; height: 100%; display: block; }
  header, .actions { display: none; }
  .stage { border-radius: 0; height: 100vh; height: 100dvh; width: 100vw; aspect-ratio: auto; }
}
/* Fullscreen via the button */
.stage:fullscreen { border-radius: 0; width: 100vw; height: 100vh; aspect-ratio: auto; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito+Sans:wght@400;700&display=swap">

<div class="wrap">
  <header>
    <h1><span class="flag" aria-hidden="true"></span>Curly</h1>
    <p class="sub">A Nature Documentary · 1:20</p>
  </header>

  <div class="stage" id="stage">
    <video id="vid" src="curly.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>

  <div class="actions">
    <button id="fs" type="button">Play full screen</button>
    <p class="hint"><span class="rotate" aria-hidden="true">📱</span> Or just turn your phone sideways. The video fills the screen.</p>
  </div>
</div>

<script>
const vid = document.getElementById('vid');
const stage = document.getElementById('stage');
document.getElementById('fs').addEventListener('click', async () => {
  vid.play().catch(() => {});
  try {
    if (stage.requestFullscreen) {
      await stage.requestFullscreen();
      try { await screen.orientation.lock('landscape'); } catch (e) {}
    } else if (vid.webkitEnterFullscreen) {
      vid.webkitEnterFullscreen(); // iPhone: native player, rotates with the phone
    }
  } catch (e) {
    if (vid.webkitEnterFullscreen) { try { vid.webkitEnterFullscreen(); } catch (e2) {} }
  }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) { try { screen.orientation.unlock(); } catch (e) {} }
});
</script>
